# Tokyo Night lock screen, minimal
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 6, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/Pictures/wallpapers/tokyonight.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# time
label {
    monitor =
    text = <b>$TIME</b>
    font_size = 80
    font_family = $font
    color = rgb(c0caf5)
    shadow_passes = 2
    shadow_size = 4
    position = 0, 110
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"
    font_size = 14
    font_family = $font
    color = rgb(7aa2f7)
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 42
    outline_thickness = 2
    rounding = -1
    inner_color = rgba(1a1b26cc)
    outer_color = rgba(7aa2f766)
    check_color = rgb(bb9af7)
    fail_color = rgb(f7768e)
    font_color = rgb(c0caf5)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">пароль</span>
    fail_text = <span foreground="##f7768e">неверный пароль</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
}

# keyboard layout
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 11
    font_family = $font
    color = rgb(565f89)
    position = 0, -85
    halign = center
    valign = center
}
